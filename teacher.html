<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聲音偵探｜教師後台</title><link rel="stylesheet" href="style.css"></head><body><header><h1>📋 聲音偵探｜教師管理後台</h1><p>學生答案、CER 論證、完整 Gemini 對話</p></header><main><section class="card" id="login"><h2>教師登入</h2><label>電子郵件</label><input id="email" type="email"><label>密碼</label><input id="password" type="password"><button id="signIn">登入</button><p id="msg" role="status"></p></section><div id="panel" class="hidden"><section class="card"><div class="toolbar"><strong id="teacherName"></strong><button id="refresh">重新整理</button><button id="csv">下載學習單 CSV</button><button id="json">下載完整 JSON（含對話）</button><button id="signOut" class="secondary">登出</button></div><p id="count" class="muted"></p><label>搜尋學生</label><input id="filter" placeholder="輸入班級或座號"></section><section class="card"><div id="students"></div></section></div></main><script src="config.js"></script><script type="module" src="teacher.js"></script></body></html>
